# NodePort: a ClusterIP plus a port opened on every node (30000-32767).
apiVersion: v1
kind: Service
metadata:
  name: web-nodeport
  labels:
    app: web-nodeport
spec:
  type: NodePort
  selector:
    app: web-nodeport
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
