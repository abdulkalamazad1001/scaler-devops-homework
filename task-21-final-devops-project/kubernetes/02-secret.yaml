# Lab-only credentials so `kubectl apply -f kubernetes/` works on minikube.
# For a real environment create the Secret out of band instead, e.g.
#   kubectl -n taskboard create secret generic taskboard-db \
#     --from-literal=DB_USER=taskboard --from-literal=DB_PASSWORD="$(openssl rand -base64 24)"
# or use Sealed Secrets / External Secrets Operator. This path is allowlisted in
# security/.gitleaks.toml with that justification.
apiVersion: v1
kind: Secret
metadata:
  name: taskboard-db
  namespace: taskboard
  labels:
    app.kubernetes.io/part-of: taskboard
type: Opaque
stringData:
  DB_USER: taskboard
  DB_PASSWORD: change-me-lab-only
