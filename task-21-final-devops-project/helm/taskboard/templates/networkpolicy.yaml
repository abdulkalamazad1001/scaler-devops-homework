{{- if .Values.networkPolicy.enabled }}
{{- $full := include "taskboard.fullname" . }}
# Only the backend may talk to PostgreSQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}-postgres
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "taskboard.selectorLabels" (dict "ctx" $ "component" "database") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "taskboard.selectorLabels" (dict "ctx" $ "component" "backend") | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
