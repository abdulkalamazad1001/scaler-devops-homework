apiVersion: v1
kind: Pod
metadata:
  name: {{ include "taskboard.fullname" . }}-smoke-test
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
  containers:
    - name: smoke
      image: curlimages/curl:8.10.1
      command: ["sh", "-c"]
      args:
        - |
          set -e
          curl -fsS http://{{ include "taskboard.fullname" . }}-backend:{{ .Values.backend.port }}/ready
          curl -fsS http://{{ include "taskboard.fullname" . }}-frontend/healthz
          curl -fsS http://{{ include "taskboard.fullname" . }}-frontend/api/tasks/stats
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
