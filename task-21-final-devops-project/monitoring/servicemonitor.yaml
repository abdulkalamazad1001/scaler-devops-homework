# Plain-kubectl version of the objects the Helm chart renders (helm/taskboard/templates/).
# Use with the manifests in kubernetes/; the Helm/Argo CD path does not need this file.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: taskboard-backend
  namespace: taskboard
  labels:
    app.kubernetes.io/name: taskboard
    app.kubernetes.io/part-of: taskboard
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: taskboard
      app.kubernetes.io/component: backend
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
