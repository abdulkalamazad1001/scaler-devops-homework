# CI/CD for the TaskBoard final project.
#
#   lint-test ─┐
#   sast ──────┤
#   sca ───────┼─► build-scan-push (backend, frontend) ─► deploy-gitops   (default)
#   secrets ───┤                                       └► deploy-helm     (vars.DEPLOY_MODE == 'helm')
#   iac-scan ──┘
#
# Pull requests run everything up to the image scan but push nothing.
# This folder is the root of the repository devops-student/final-devops-project.
# Third-party actions are pinned to release tags here for readability; pin them
# to full commit SHAs in a real project so a moved tag cannot change the pipeline.
name: TaskBoard CI/CD

on:
  push:
    branches: [main]
    # A change to the dev values alone (replicas, the CI tag bump) needs no new image.
    paths-ignore:
      - "**.md"
      - "helm/taskboard/values-dev.yaml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/taskboard

jobs:
  # ---------------------------------------------------------------- build & test
  lint-test:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: application/backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: application/backend
        run: pip install -r requirements-dev.txt

      - name: Ruff
        working-directory: application/backend
        run: ruff check . --output-format=github

      - name: Pytest
        working-directory: application/backend
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: application/backend/coverage.xml

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: application/frontend/package-lock.json

      - name: Build frontend
        working-directory: application/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Lint Helm chart
        run: |
          helm lint helm/taskboard -f helm/taskboard/values-dev.yaml
          helm template taskboard helm/taskboard -n taskboard -f helm/taskboard/values-dev.yaml > /dev/null

  # ---------------------------------------------------------------- DevSecOps
  sast:
    name: SAST (Semgrep + Bandit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install scanners
        run: pip install --quiet semgrep==1.179.0 bandit==1.9.4
      - name: Semgrep
        run: |
          semgrep scan --metrics=off --error \
            --config p/python --config p/javascript --config p/react \
            --config p/dockerfile --config security/semgrep-rules.yaml
      - name: Bandit
        run: bandit -c security/bandit.yaml -r application/backend/app -ll

  sca:
    name: SCA (dependencies)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pip-audit (backend)
        run: |
          pip install --quiet pip-audit==2.10.1
          pip-audit --strict -r application/backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: npm audit (frontend)
        working-directory: application/frontend
        run: npm audit --audit-level=high

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not only the last commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: security/.gitleaks.toml

  iac-scan:
    name: IaC and manifest scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Trivy config scan (Terraform, Kubernetes, Helm, Dockerfiles)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: security/trivy.yaml
          version: v0.75.0

  # ---------------------------------------------------------------- images
  build-scan-push:
    name: Build, scan and push (${{ matrix.component }})
    needs: [lint-test, sast, sca, secrets, iac-scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # keyless cosign signature
    strategy:
      fail-fast: true
      matrix:
        component: [backend, frontend]
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Image tag = short commit SHA
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.component }}.Dockerfile
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ steps.vars.outputs.tag }}
          load: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Trivy image scan (gate on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ steps.vars.outputs.tag }}
          trivy-config: security/trivy.yaml
          version: v0.75.0

      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ steps.vars.outputs.tag }}
          format: cyclonedx
          output: sbom-${{ matrix.component }}.cdx.json
          exit-code: "0"
          version: v0.75.0
          skip-setup-trivy: true

      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.component }}
          path: sbom-${{ matrix.component }}.cdx.json

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.component }}.Dockerfile
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ steps.vars.outputs.tag }}
          push: true
          cache-from: type=gha,scope=${{ matrix.component }}

      - uses: sigstore/cosign-installer@v4
        if: steps.push.outcome == 'success'

      - name: Sign image (keyless)
        if: steps.push.outcome == 'success'
        run: cosign sign --yes "${IMAGE_PREFIX}-${{ matrix.component }}@${{ steps.push.outputs.digest }}"

  # ---------------------------------------------------------------- deploy
  # GitOps (default): write the new tag into the dev values file. Argo CD sees
  # the commit and rolls it out. CI never needs cluster credentials.
  deploy-gitops:
    name: Deploy (GitOps tag bump)
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_MODE != 'helm'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: deploy-dev
    steps:
      - uses: actions/checkout@v7
      - name: Update image tag in values-dev.yaml
        env:
          TAG: ${{ needs.build-scan-push.outputs.tag }}
        run: |
          yq -i '.image.tag = strenv(TAG)' helm/taskboard/values-dev.yaml
          git diff
      - name: Commit and push
        env:
          TAG: ${{ needs.build-scan-push.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy ${TAG} to dev [skip ci]" || { echo "Tag already deployed"; exit 0; }
          git push origin HEAD:main

  # Push-based alternative for a cluster without Argo CD.
  deploy-helm:
    name: Deploy (helm upgrade)
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_MODE == 'helm'
    runs-on: ubuntu-24.04
    environment: dev
    concurrency:
      group: deploy-dev
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2
      - name: Configure kubectl
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: helm upgrade
        run: |
          helm upgrade --install taskboard helm/taskboard \
            --namespace taskboard --create-namespace \
            -f helm/taskboard/values-dev.yaml \
            --set image.tag=${{ needs.build-scan-push.outputs.tag }} \
            --atomic --wait --timeout 5m
      - name: Smoke test
        run: helm test taskboard -n taskboard --logs
