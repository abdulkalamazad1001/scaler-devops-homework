apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: production-webapp
  labels:
    app: load-generator
spec:
  restartPolicy: Never
  containers:
    - name: load
      image: busybox:1.36
      command: ["/bin/sh", "-c", "while true; do wget -q -O- http://web-service > /dev/null; done"]
