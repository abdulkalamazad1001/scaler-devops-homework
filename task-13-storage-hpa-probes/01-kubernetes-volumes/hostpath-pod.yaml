# hostPath: mounts a directory of the node's filesystem into the Pod.
# On minikube the "node" is the minikube container, so the directory lives there,
# not on the laptop/VM that runs minikube.
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-demo
  labels:
    app: hostpath-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo \"hello from $(hostname) at $(date -u)\" >> /data/hello.txt; sleep 3600"]
      volumeMounts:
        - name: host-storage
          mountPath: /data
  volumes:
    - name: host-storage
      hostPath:
        path: /tmp/hostpath-data
        type: DirectoryOrCreate
