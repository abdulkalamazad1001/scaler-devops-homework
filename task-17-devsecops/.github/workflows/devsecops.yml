# DevSecOps pipeline for task-17-devsecops.
#
# GitHub only runs workflows from .github/workflows/ at the ROOT of a repository.
# This file is kept next to the project so the task folder is self-contained.
# To run it, copy it to <repo-root>/.github/workflows/devsecops.yml. All paths
# below are relative to the repository root and use APP_DIR, so nothing else
# needs to change. If this folder is its own repository instead, set APP_DIR to ".".
#
# Flow:
#   build -> unit-test -> sast + sca + secret-scan (in parallel)
#         -> docker-build -> image-scan -> security-gate -> push -> deploy

name: devsecops

on:
  push:
    branches: [main]
    paths:
      - "task-17-devsecops/**"
      - ".github/workflows/devsecops.yml"
  pull_request:
    branches: [main]
    paths:
      - "task-17-devsecops/**"
      - ".github/workflows/devsecops.yml"
  workflow_dispatch:

# Least privilege by default. Jobs that need more ask for it themselves.
permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: task-17-devsecops
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devsecops-demo
  BANDIT_VERSION: "1.9.4"
  PIP_AUDIT_VERSION: "2.10.1"
  GITLEAKS_VERSION: "8.21.2"
  TRIVY_VERSION: "0.58.1"

defaults:
  run:
    shell: bash
    working-directory: task-17-devsecops

jobs:
  # 1. Build: install dependencies and make sure the code at least compiles.
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check dependency tree is consistent
        run: pip check
      - name: Byte-compile the application
        run: python -m compileall -q app

  # 2. Unit tests with coverage. Fails the run if a test fails.
  unit-test:
    name: Unit test
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90 --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: ${{ env.APP_DIR }}/reports/junit.xml

  # 3. SAST: Bandit reads the Python source for insecure patterns.
  #    Report mode: the security-gate job decides pass/fail.
  sast:
    name: SAST (Bandit)
    needs: unit-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "bandit==${BANDIT_VERSION}"
      - name: Run Bandit
        run: |
          mkdir -p reports
          bandit -c pyproject.toml -r app --exit-zero
          bandit -c pyproject.toml -r app -f json -o reports/bandit.json --exit-zero -q
      - uses: actions/upload-artifact@v4
        with:
          name: report-bandit
          path: ${{ env.APP_DIR }}/reports/bandit.json

  # 4. SCA: pip-audit checks pinned runtime dependencies against the PyPI
  #    advisory database.
  sca:
    name: SCA (pip-audit)
    needs: unit-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "pip-audit==${PIP_AUDIT_VERSION}"
      - name: Run pip-audit
        run: |
          mkdir -p reports
          pip-audit -r requirements.txt || true
          pip-audit -r requirements.txt -f json -o reports/pip-audit.json \
            || echo "pip-audit reported findings, the security gate will evaluate them"
      - uses: actions/upload-artifact@v4
        with:
          name: report-pip-audit
          path: ${{ env.APP_DIR }}/reports/pip-audit.json

  # 5. Secret scan: Gitleaks walks the git history, not just the current
  #    files, because a secret deleted in a later commit is still leaked.
  #    --log-opts limits it to commits touching this project's folder; in a
  #    single-project repository drop that flag to scan everything.
  secret-scan:
    name: Secret scan (Gitleaks)
    needs: unit-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${tarball}\$" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Run Gitleaks
        working-directory: .
        run: |
          mkdir -p "${APP_DIR}/reports"
          gitleaks git . \
            --log-opts="-- ${APP_DIR}" \
            --config "${APP_DIR}/.gitleaks.toml" \
            --redact \
            --verbose \
            --report-format json \
            --report-path "${APP_DIR}/reports/gitleaks.json" \
            --exit-code 0
      - uses: actions/upload-artifact@v4
        with:
          name: report-gitleaks
          path: ${{ env.APP_DIR }}/reports/gitleaks.json

  # 6. Build the container image once and pass it on as an artifact, so the
  #    image that is scanned is exactly the image that is pushed.
  docker-build:
    name: Docker build
    needs: [sast, sca, secret-scan]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --build-arg "APP_VERSION=${GITHUB_SHA::7}" \
            -t "${IMAGE_NAME}:${{ github.sha }}" .
          docker image ls "${IMAGE_NAME}"
      - name: Check the image does not run as root
        run: |
          user=$(docker image inspect "${IMAGE_NAME}:${{ github.sha }}" --format '{{.Config.User}}')
          echo "Image user: ${user}"
          if [ -z "${user}" ] || [ "${user%%:*}" = "0" ] || [ "${user%%:*}" = "root" ]; then
            echo "::error::Image runs as root"; exit 1
          fi
      - name: Save image
        run: docker save "${IMAGE_NAME}:${{ github.sha }}" -o "${{ runner.temp }}/image.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  # 7. Container image scan: OS packages and Python packages inside the image.
  image-scan:
    name: Image scan (Trivy)
    needs: docker-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Install Trivy
        working-directory: ${{ runner.temp }}
        run: |
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfL "${base}/trivy_${TRIVY_VERSION}_checksums.txt" | grep " ${tarball}\$" | sha256sum -c -
          tar -xzf "${tarball}" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
      - name: Run Trivy
        run: |
          mkdir -p reports
          # Human-readable table in the log (HIGH and CRITICAL only)
          trivy image --input "${{ runner.temp }}/image.tar" \
            --scanners vuln --ignore-unfixed --ignorefile .trivyignore \
            --severity HIGH,CRITICAL --format table --exit-code 0
          # Full JSON for the gate and for the record (all severities)
          trivy image --input "${{ runner.temp }}/image.tar" \
            --scanners vuln --ignore-unfixed --ignorefile .trivyignore \
            --format json --output reports/trivy-image.json --exit-code 0 --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: report-trivy
          path: ${{ env.APP_DIR }}/reports/trivy-image.json

  # 8. Security gate: one place that turns all reports into pass or fail.
  security-gate:
    name: Security gate
    needs: [sast, sca, secret-scan, image-scan]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          merge-multiple: true
          path: ${{ env.APP_DIR }}/reports
      - name: Evaluate reports
        run: python scripts/security_gate.py reports

  # 9. Push to GHCR, only for commits that landed on main.
  push:
    name: Push image (GHCR)
    needs: security-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load, tag and push
        working-directory: .
        run: |
          docker load -i "${{ runner.temp }}/image.tar"
          docker tag "${IMAGE_NAME}:${{ github.sha }}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${{ github.sha }}"
          docker push "${IMAGE_NAME}:latest"

  # 10. Deploy to a throwaway kind cluster inside the runner and smoke test it.
  #     For a real cluster, replace the kind step with a kubeconfig secret
  #     (see README.md, "Deploying to a real cluster").
  deploy:
    name: Deploy to Kubernetes
    needs: push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: devsecops
      - name: Create namespace and image pull secret
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl -n devsecops-demo create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}"
      - name: Apply manifests with the new image tag
        run: |
          sed -i "s|ghcr.io/devops-student/devsecops-demo:latest|${IMAGE_NAME}:${{ github.sha }}|" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml -f k8s/service.yaml
          kubectl -n devsecops-demo rollout status deployment/devsecops-demo --timeout=120s
          kubectl -n devsecops-demo get deploy,pods,svc -o wide
      - name: Smoke test
        run: |
          kubectl -n devsecops-demo port-forward service/devsecops-demo 8080:80 >/dev/null 2>&1 &
          for i in $(seq 1 10); do curl -sf http://127.0.0.1:8080/health && break; sleep 1; done
          echo
          curl -sf http://127.0.0.1:8080/api/status
          echo
          kubectl -n devsecops-demo exec deploy/devsecops-demo -- id
