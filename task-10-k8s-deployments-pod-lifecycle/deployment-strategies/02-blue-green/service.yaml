apiVersion: v1
kind: Service
metadata:
  name: myapp-service
  labels:
    app: myapp
spec:
  type: NodePort
  # The switch: change slot to green (kubectl patch) to move all traffic at once.
  selector:
    app: myapp
    slot: blue
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30020
      protocol: TCP
