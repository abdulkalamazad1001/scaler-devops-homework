apiVersion: v1
kind: Service
metadata:
  name: myapp-canary-service
  labels:
    app: myapp-canary
spec:
  type: NodePort
  # Only the shared label, so it selects both stable (9) and canary (1) Pods.
  # Traffic split follows the Pod ratio: about 90% stable, 10% canary.
  selector:
    app: myapp-canary
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30030
      protocol: TCP
