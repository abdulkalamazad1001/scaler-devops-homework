apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-rolling
  annotations:
    kubernetes.io/change-cause: "v1: nginx 1.24-alpine"
  labels:
    app: app-rolling
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # at most 1 Pod above replicas during the update (5 total)
      maxUnavailable: 0  # never drop below 4 ready Pods
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: app-rolling
  template:
    metadata:
      labels:
        app: app-rolling
        version: v1
    spec:
      containers:
        - name: web
          image: nginx:1.24-alpine
          # Write a one line page that names the version and the Pod, then run nginx
          # in the foreground. This makes it easy to see which Pod answered a curl.
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "app-rolling v1 served by $(hostname)" > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 2
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
