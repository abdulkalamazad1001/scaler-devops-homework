# Same tiny program under different restartPolicy values.
# restartPolicy is set per Pod and applies to all its containers.
apiVersion: v1
kind: Pod
metadata:
  name: rp-always-exit0
spec:
  restartPolicy: Always          # restarts even after a clean exit
  containers:
    - name: task
      image: busybox:1.36
      command: ["sh", "-c", "echo 'done'; exit 0"]
---
apiVersion: v1
kind: Pod
metadata:
  name: rp-onfailure-exit0
spec:
  restartPolicy: OnFailure       # clean exit: not restarted
  containers:
    - name: task
      image: busybox:1.36
      command: ["sh", "-c", "echo 'done'; exit 0"]
---
apiVersion: v1
kind: Pod
metadata:
  name: rp-onfailure-exit1
spec:
  restartPolicy: OnFailure       # non-zero exit: restarted
  containers:
    - name: task
      image: busybox:1.36
      command: ["sh", "-c", "echo 'failing'; exit 1"]
---
apiVersion: v1
kind: Pod
metadata:
  name: rp-never-exit1
spec:
  restartPolicy: Never           # never restarted, Pod ends Failed
  containers:
    - name: task
      image: busybox:1.36
      command: ["sh", "-c", "echo 'failing'; exit 1"]
