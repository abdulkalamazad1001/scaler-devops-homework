# DEMO VALUES ONLY.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  DB_USER: demo_user
  DB_PASSWORD: demo-password-not-real
---
apiVersion: v1
kind: Pod
metadata:
  name: config-app
  labels:
    scenario: configuration
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo \"connecting as $DB_USER\"; sleep 3600"]
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_PASSWORD
