# BUG: the server binds to 127.0.0.1, so it only accepts connections from
# inside its own pod. Other pods (and the Service) get "connection refused".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  labels:
    app: inventory
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
        - name: api
          image: python:3.12-alpine
          command: ["python", "-u", "-m", "http.server", "8080", "--bind", "127.0.0.1"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
spec:
  selector:
    app: inventory
  ports:
    - port: 80
      targetPort: 8080
