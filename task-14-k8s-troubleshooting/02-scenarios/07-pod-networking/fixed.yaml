# Fixed: bind to all interfaces (0.0.0.0) so the pod IP accepts connections.
# A readiness probe was added: kubelet probes the pod IP, so with the old
# 127.0.0.1 binding the pods would have shown 0/1 READY and the problem would
# have been visible in "kubectl get pods" straight away.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  labels:
    app: inventory
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
        - name: api
          image: python:3.12-alpine
          command: ["python", "-u", "-m", "http.server", "8080", "--bind", "0.0.0.0"]
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
spec:
  selector:
    app: inventory
  ports:
    - port: 80
      targetPort: 8080
