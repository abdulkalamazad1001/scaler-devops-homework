# Shows the three ways of consuming a ConfigMap:
#   1. env + configMapKeyRef  -> one key, renamed
#   2. envFrom + configMapRef -> every key of the ConfigMap
#   3. volume                 -> every key becomes a file under /etc/config
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
  labels:
    app: config-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: APP_LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: LOG_LEVEL
      envFrom:
        - configMapRef:
            name: app-config
      volumeMounts:
        - name: config-files
          mountPath: /etc/config
          readOnly: true
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
  volumes:
    - name: config-files
      configMap:
        name: app-config-files
