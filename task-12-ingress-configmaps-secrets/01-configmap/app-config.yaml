# Two ConfigMaps:
#   app-config        plain key/value pairs, consumed as environment variables
#   app-config-files  file-style keys, consumed as a mounted volume
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    app: yatri
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  APP_PORT: "5000"
  DEFAULT_CURRENCY: "INR"
  MAX_BOOKING_DAYS: "30"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-files
  labels:
    app: yatri
data:
  app.properties: |
    feature.dark_mode=true
    cache.ttl_seconds=300
    max.upload.mb=25
  theme.txt: |
    color=teal
    font=Ubuntu Mono
