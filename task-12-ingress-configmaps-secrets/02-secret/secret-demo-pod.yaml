# Consumes db-secret two ways:
#   1. env + secretKeyRef -> individual keys as environment variables
#   2. volume             -> every key becomes a file under /etc/secrets (tmpfs)
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
  labels:
    app: secret-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_NAME
      volumeMounts:
        - name: db-credentials
          mountPath: /etc/secrets
          readOnly: true
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
  volumes:
    - name: db-credentials
      secret:
        secretName: db-secret
        defaultMode: 0400
