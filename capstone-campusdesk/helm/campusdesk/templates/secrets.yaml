{{- if .Values.secrets.create }}
{{- $db := lookup "v1" "Secret" .Release.Namespace .Values.database.existingSecret }}
{{- $password := randAlphaNum 32 }}
{{- if and $db $db.data (hasKey $db.data "POSTGRES_PASSWORD") }}
{{- $password = index $db.data "POSTGRES_PASSWORD" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.database.existingSecret }}
  annotations:
    # Keep the password with the retained PostgreSQL volume after helm uninstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  POSTGRES_DB: {{ .Values.database.name | b64enc }}
  POSTGRES_USER: {{ .Values.database.user | b64enc }}
  POSTGRES_PASSWORD: {{ $password | b64enc }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@postgres:5432/%s" .Values.database.user $password .Values.database.name | b64enc }}
{{- if .Values.monitoring.enabled }}
{{- $grafana := lookup "v1" "Secret" .Release.Namespace .Values.monitoring.grafanaSecret }}
{{- $admin := randAlphaNum 32 }}
{{- if and $grafana $grafana.data (hasKey $grafana.data "password") }}
{{- $admin = index $grafana.data "password" | b64dec }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.monitoring.grafanaSecret }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  user: {{ "admin" | b64enc }}
  password: {{ $admin | b64enc }}
{{- end }}
{{- end }}
