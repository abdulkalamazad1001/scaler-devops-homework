kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: campusdesk
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8088
        listenAddress: "127.0.0.1"
      - containerPort: 30300
        hostPort: 3001
        listenAddress: "127.0.0.1"
      - containerPort: 30900
        hostPort: 9090
        listenAddress: "127.0.0.1"
