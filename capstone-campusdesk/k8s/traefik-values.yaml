service:
  type: NodePort
additionalArguments:
  - --providers.kubernetesingress.ingressendpoint.ip=127.0.0.1
ports:
  web:
    nodePort: 30080
  websecure:
    expose:
      default: false
providers:
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: false
ingressClass:
  enabled: true
  isDefaultClass: false
