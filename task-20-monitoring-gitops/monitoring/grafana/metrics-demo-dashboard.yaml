# Loaded automatically by the Grafana dashboard sidecar because of the grafana_dashboard label.
apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-demo-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  metrics-demo.json: |
    {
      "uid": "metrics-demo",
      "title": "Metrics Demo - Application Health",
      "tags": [
        "monitoring-demo"
      ],
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Targets up",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(up{job=\"metrics-demo\"})"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Request rate",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(demo_http_requests_total{job=\"metrics-demo\"}[5m]))"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Error ratio (5m)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(demo_http_requests_total{job=\"metrics-demo\",status=~\"5..\"}[5m])) / sum(rate(demo_http_requests_total{job=\"metrics-demo\"}[5m]))"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Firing alerts",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(ALERTS{alertstate=\"firing\",namespace=\"monitoring-demo\"}) or vector(0)"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Requests per second by path and status",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (path, status) (rate(demo_http_requests_total{job=\"metrics-demo\"}[2m]))",
              "legendFormat": "{{path}} {{status}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Latency p50 / p95 / p99",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(demo_http_request_duration_seconds_bucket{job=\"metrics-demo\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(demo_http_request_duration_seconds_bucket{job=\"metrics-demo\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(demo_http_request_duration_seconds_bucket{job=\"metrics-demo\"}[5m])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU usage vs limit (cores)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"monitoring-demo\",container=\"metrics-demo\"}[2m]))",
              "legendFormat": "{{pod}} used"
            },
            {
              "refId": "B",
              "expr": "sum by (pod) (kube_pod_container_resource_limits{namespace=\"monitoring-demo\",container=\"metrics-demo\",resource=\"cpu\"})",
              "legendFormat": "{{pod}} limit"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Memory working set vs limit",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"monitoring-demo\",container=\"metrics-demo\"})",
              "legendFormat": "{{pod}} used"
            },
            {
              "refId": "B",
              "expr": "sum by (pod) (kube_pod_container_resource_limits{namespace=\"monitoring-demo\",container=\"metrics-demo\",resource=\"memory\"})",
              "legendFormat": "{{pod}} limit"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Node CPU and memory utilisation",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))",
              "legendFormat": "CPU % {{instance}}"
            },
            {
              "refId": "B",
              "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)",
              "legendFormat": "Memory % {{instance}}"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Pod readiness and restarts",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (kube_pod_status_ready{namespace=\"monitoring-demo\",condition=\"true\"})",
              "legendFormat": "{{pod}} ready"
            },
            {
              "refId": "B",
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"monitoring-demo\"}[15m]))",
              "legendFormat": "{{pod}} restarts (15m)"
            }
          ]
        },
        {
          "id": 11,
          "type": "logs",
          "title": "Error logs (Loki)",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 28,
            "w": 24,
            "h": 8
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"monitoring-demo\", app=\"metrics-demo\"} | json | level=\"error\""
            }
          ]
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      }
    }
