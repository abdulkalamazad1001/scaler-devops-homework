# Minimal webhook receiver for Alertmanager. It prints one line per alert in
# every notification, so `kubectl logs deploy/alert-sink` shows what was sent.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-sink
  namespace: monitoring-demo
data:
  sink.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            body = json.loads(self.rfile.read(int(self.headers["Content-Length"])))
            for a in body.get("alerts", []):
                labels = a["labels"]
                print(f'{a["status"]:8} {labels.get("alertname")} '
                      f'severity={labels.get("severity")} pod={labels.get("pod", "-")} '
                      f'startsAt={a["startsAt"]}', flush=True)
            self.send_response(200)
            self.end_headers()

        def log_message(self, *args):
            pass

    print("alert-sink listening on :8080", flush=True)
    HTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-sink
  namespace: monitoring-demo
  labels:
    app: alert-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-sink
  template:
    metadata:
      labels:
        app: alert-sink
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: sink
          image: python:3.12-alpine
          command: ["python", "/app/sink.py"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: alert-sink
---
apiVersion: v1
kind: Service
metadata:
  name: alert-sink
  namespace: monitoring-demo
spec:
  selector:
    app: alert-sink
  ports:
    - name: http
      port: 8080
      targetPort: http
